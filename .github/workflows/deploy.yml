name: Deploy site to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup site toolchain
        uses: ./.github/actions/setup-site
      - name: Verify and build for the configured Pages URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # Pages can report HTTP while a new domain's certificate is pending.
          # Published metadata should use the final HTTPS URL throughout.
          export SITE_URL="${SITE_URL/#http:/https:}"
          npm run verify
      - name: Upload the verified static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
