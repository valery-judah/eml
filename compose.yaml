services:
  site:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:?Load .infra/versions.env}
        NPM_VERSION: ${NPM_VERSION:?Load .infra/versions.env}
    init: true
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "5173"]
    working_dir: /workspace
    environment:
      SITE_URL: ${SITE_URL:-https://eml.systems/}
    ports:
      - "127.0.0.1:${SITE_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - eml-node-modules:/workspace/node_modules
volumes:
  eml-node-modules:
